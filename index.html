<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펭수 스네이크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --stage:       #0e2a47;
    --stage-deep:  #081b2e;
    --grid-line:   #0d2b48;
    --yellow:      #ffd400;
    --ink:         #141414;
    --snow:        #eef3f7;
    --live:        #e8402a;

    --display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --body: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;

    --board: min(480px, calc(100vw - 40px));
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: var(--stage);
    color: var(--snow);
    font-family: var(--body);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 20px 40px;
  }

  .studio {
    width: var(--board);
  }

  /* ---- 방송 상태 슬레이트 ---- */

  .slate {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    font-size: 13px;
    letter-spacing: -0.01em;
    color: #ffb3a8;
  }

  .live b {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--live);
    animation: blink 1.8s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }

  .slate h1 {
    font-family: var(--display);
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--snow);
  }

  /* ---- 스튜디오 모니터 ---- */

  .monitor {
    position: relative;
    width: var(--board);
    height: var(--board);
    border-radius: 6px;
    padding: 8px;
    background: #061523;
    box-shadow: inset 0 0 0 1px #1d4771;
  }

  #board {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 2px;
    background: var(--stage-deep);
  }

  /* ---- 오버레이 (시작 / 게임오버) ---- */

  .overlay {
    position: absolute;
    inset: 8px;
    display: grid;
    place-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
    border-radius: 2px;
    background: rgba(6, 21, 35, 0.88);
  }

  .overlay[hidden] { display: none; }

  .overlay .shout {
    font-family: var(--display);
    font-size: clamp(34px, 11vw, 52px);
    line-height: 1;
    color: var(--yellow);
    margin: 0;
  }

  .overlay p {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: #a9c3da;
  }

  .overlay .tally {
    font-family: var(--display);
    font-size: 20px;
    color: var(--snow);
  }

  .overlay .record {
    color: var(--yellow);
    font-size: 14px;
  }

  .overlay .record[hidden] { display: none; }

  /* ---- 방송 자막 바 ---- */

  .lower-third {
    display: flex;
    gap: 2px;
    margin-top: 12px;
  }

  .lower-third .cell {
    flex: 1;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 22px;
    background: var(--yellow);
    color: var(--ink);
    clip-path: polygon(0 0, 100% 0, calc(100% - 13px) 100%, 13px 100%);
  }

  .lower-third .k {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .lower-third .v {
    font-family: var(--display);
    font-size: 24px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* ---- 조작 안내 ---- */

  .keys {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    margin: 16px 2px 0;
    font-size: 13px;
    color: #7fa0bd;
  }

  .keys kbd {
    font: inherit;
    font-weight: 700;
    min-width: 24px;
    padding: 3px 6px;
    text-align: center;
    border-radius: 4px;
    color: var(--snow);
    background: #143a5e;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35);
  }

  .keys span { margin-left: 4px; }
  .keys span:first-of-type { margin-left: 0; }

  .keys .sep {
    width: 100%;
    height: 0;
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .live b { animation: none; }
  }

  :focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<main class="studio">
  <header class="slate">
    <span class="live"><b></b>생방송</span>
    <h1>펭수 스네이크</h1>
  </header>

  <div class="monitor">
    <canvas id="board" aria-label="펭수 스네이크 게임 보드"></canvas>

    <div class="overlay" id="overlay">
      <p class="shout" id="shout">펭-하!</p>
      <p class="tally" id="tally" hidden></p>
      <p class="record" id="record" hidden>신기록입니다</p>
      <p id="hint">스페이스바를 누르면 시작합니다</p>
    </div>
  </div>

  <div class="lower-third">
    <div class="cell"><span class="k">점수</span><span class="v" id="score">0</span></div>
    <div class="cell"><span class="k">최고</span><span class="v" id="best">0</span></div>
  </div>

  <p class="keys">
    <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
    <span>이동</span>
    <span class="sep"></span>
    <kbd>스페이스</kbd><span>시작</span>
  </p>
</main>

<script>
(() => {
  'use strict';

  // ── 설정 (PRD 8.2) ──────────────────────────────────────────
  const GRID     = 20;      // 20 × 20 칸
  const CELL     = 24;      // 칸당 24px
  const BOARD_PX = GRID * CELL;
  const TICK_MS  = 120;     // 한 칸 이동 간격
  const MAX_DELTA = 250;    // 탭 복귀 시 누적 폭주 방지 (PRD R4)
  const START_LEN = 3;
  const BEST_KEY = 'pengsoo-snake-best';

  const DIRS = {
    up:    { x:  0, y: -1 },
    down:  { x:  0, y:  1 },
    left:  { x: -1, y:  0 },
    right: { x:  1, y:  0 },
  };

  const KEYMAP = {
    ArrowUp: 'up',    KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
  };

  // ── DOM ─────────────────────────────────────────────────────
  const canvas  = document.getElementById('board');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const shoutEl = document.getElementById('shout');
  const tallyEl = document.getElementById('tally');
  const recordEl = document.getElementById('record');
  const hintEl  = document.getElementById('hint');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = BOARD_PX * DPR;
  canvas.height = BOARD_PX * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // ── 최고 점수 (PRD F-22 / F-24) ─────────────────────────────
  // localStorage가 막힌 환경(시크릿 모드 등)에서도 게임은 그대로 돌아간다.
  function readBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch {
      return 0;
    }
  }

  function writeBest(value) {
    try {
      localStorage.setItem(BEST_KEY, String(value));
    } catch {
      /* 저장 실패는 무시하고 진행 */
    }
  }

  // ── 펭수 스프라이트 ─────────────────────────────────────────
  // 원본 JPG의 회색 배경을 제거한 투명 PNG. 로드에 실패하면
  // 도형으로 폴백해서 게임 자체는 멀쩡히 돌아간다 (PRD R6).
  const HEAD_W = CELL * 1.8;
  let headSprite = null;

  const pengsoo = new Image();
  pengsoo.onload = () => {
    const w = Math.round(HEAD_W * DPR);
    const h = Math.round(w * pengsoo.naturalHeight / pengsoo.naturalWidth);
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    off.getContext('2d').drawImage(pengsoo, 0, 0, w, h);
    headSprite = off;
  };
  pengsoo.src = PENGSOO_SPRITE;

  // ── 게임 상태 ───────────────────────────────────────────────
  let state, snake, direction, inputQueue, food, score, best;

  best = readBest();
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [];
    for (let i = 0; i < START_LEN; i++) {
      snake.push({ x: mid - i, y: mid });   // 머리가 index 0
    }
    direction = DIRS.right;
    inputQueue = [];
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function freeCells() {
    const taken = new Set(snake.map(s => s.y * GRID + s.x));
    const free = [];
    for (let i = 0; i < GRID * GRID; i++) {
      if (!taken.has(i)) free.push(i);
    }
    return free;
  }

  function placeFood() {
    const free = freeCells();
    if (free.length === 0) { food = null; return false; }
    const i = free[Math.floor(Math.random() * free.length)];
    food = { x: i % GRID, y: Math.floor(i / GRID) };
    return true;
  }

  // ── 입력 (PRD F-10 ~ F-14) ──────────────────────────────────
  // 입력을 큐에 쌓고 틱마다 하나씩만 꺼내 쓴다. 즉시 반영하면
  // 한 틱 안에 ↑ → ← 를 연타할 때 역주행으로 자기 몸에 박힌다.
  function lastQueuedDir() {
    return inputQueue.length ? inputQueue[inputQueue.length - 1] : direction;
  }

  function enqueue(name) {
    const next = DIRS[name];
    const prev = lastQueuedDir();
    if (next.x === -prev.x && next.y === -prev.y) return;  // 역주행 차단
    if (next.x === prev.x && next.y === prev.y) return;    // 같은 방향 중복
    if (inputQueue.length < 2) inputQueue.push(next);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state !== 'PLAYING') start();
      return;
    }
    const name = KEYMAP[e.code];
    if (!name) return;
    e.preventDefault();                 // 방향키 스크롤 차단
    if (state === 'PLAYING') enqueue(name);
  });

  // ── 한 틱 진행 (PRD F-01 ~ F-07) ────────────────────────────
  function step() {
    if (inputQueue.length) direction = inputQueue.shift();

    const head = snake[0];
    const next = { x: head.x + direction.x, y: head.y + direction.y };

    // 벽 충돌
    if (next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID) {
      return gameOver();
    }

    // 자기 몸 충돌. 먹지 않는 틱에는 꼬리가 비켜나므로 꼬리 칸은 진입 가능.
    const willEat = food && next.x === food.x && next.y === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === next.x && s.y === next.y)) {
      return gameOver();
    }

    snake.unshift(next);

    if (willEat) {
      score++;
      scoreEl.textContent = score;
      if (!placeFood()) return finish();   // 보드를 꽉 채움
    } else {
      snake.pop();
    }
  }

  // ── 렌더 ────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

    // 보드 바탕 + 격자
    ctx.fillStyle = '#081b2e';
    ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);

    ctx.strokeStyle = '#0d2b48';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      const p = i * CELL + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, BOARD_PX);
      ctx.moveTo(0, p); ctx.lineTo(BOARD_PX, p);
    }
    ctx.stroke();

    // 먹이 — 노란 원형 아이템
    if (food) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ffd400';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(cx - CELL * 0.1, cy - CELL * 0.1, CELL * 0.07, 0, Math.PI * 2);
      ctx.fill();
    }

    // 몸통 — 뒤에서 앞으로 그려 머리가 위에 오게 한다
    for (let i = snake.length - 1; i >= 1; i--) {
      const cx = snake[i].x * CELL + CELL / 2;
      const cy = snake[i].y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.36, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#141414';
      ctx.stroke();
    }

    // 머리 — 펭수
    const hx = snake[0].x * CELL + CELL / 2;
    const hy = snake[0].y * CELL + CELL / 2;
    if (headSprite) {
      const w = HEAD_W;
      const h = w * headSprite.height / headSprite.width;
      ctx.drawImage(headSprite, hx - w / 2, hy - h / 2, w, h);
    } else {
      ctx.beginPath();
      ctx.arc(hx, hy, CELL * 0.44, 0, Math.PI * 2);
      ctx.fillStyle = '#141414';
      ctx.fill();
    }
  }

  // ── 상태 전환 ───────────────────────────────────────────────
  function showOverlay({ shout, tally, record, hint }) {
    shoutEl.textContent = shout;
    tallyEl.textContent = tally || '';
    tallyEl.hidden = !tally;
    recordEl.hidden = !record;
    hintEl.textContent = hint;
    overlay.hidden = false;
  }

  function start() {
    reset();
    state = 'PLAYING';
    overlay.hidden = true;
    accumulator = 0;
    lastTime = performance.now();
  }

  function settle(shout) {
    state = 'GAME_OVER';
    const isRecord = score > best;
    if (isRecord) {
      best = score;
      bestEl.textContent = best;
      writeBest(best);
    }
    showOverlay({
      shout,
      tally: `${score}점`,
      record: isRecord && score > 0,
      hint: '스페이스바로 다시 시작합니다',
    });
  }

  function gameOver() { settle('여기까지!'); }
  function finish()   { settle('보드 완주!'); }

  // ── 고정 타임스텝 루프 (PRD 8.3) ────────────────────────────
  // setInterval을 쓰면 탭이 비활성화된 동안 타이머가 밀렸다가
  // 복귀 시 한꺼번에 터져서 펭수가 순간이동한다.
  let lastTime = 0;
  let accumulator = 0;

  function frame(now) {
    const delta = Math.min(now - lastTime, MAX_DELTA);
    lastTime = now;

    if (state === 'PLAYING') {
      accumulator += delta;
      while (accumulator >= TICK_MS && state === 'PLAYING') {
        step();
        accumulator -= TICK_MS;
      }
    }

    render();
    requestAnimationFrame(frame);
  }

  // ── 시작 ────────────────────────────────────────────────────
  reset();
  state = 'READY';
  showOverlay({
    shout: '펭-하!',
    hint: '스페이스바를 누르면 시작합니다',
  });
  requestAnimationFrame((t) => { lastTime = t; frame(t); });
})();
